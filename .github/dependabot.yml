# Dependabot, for every place in this repository that pins something someone else wrote.
#
# Security updates arrive as soon as an advisory names a version in use, whatever the
# schedule below says. The schedule is for ordinary version bumps, and those come grouped and
# weekly, because one pull request per patch release across six ecosystems is a queue nobody
# reads.
#
# Gradle sees what the build files and gradle/libs.versions.toml declare. What those pull in
# transitively is reported separately, by the dependency-submission job in security.yml.
#
# Version updates go to the release branch, not to master. master holds what is released and
# nothing else: the work for the next release, dependency bumps included, gathers on
# release/<next version> and reaches master when that version is published. Every ecosystem
# below names the branch in target-branch, and the release commit moves it on to the next one,
# so the config that lands on master with a release already points at the branch cut after it.
#
# Security updates ignore target-branch and always open against master. Because every
# ecosystem sets target-branch, none of the options below apply to them either, the ignore
# rules included: an advisory about a dependency pinned on purpose, such as the coroutines
# floor, still opens a pull request that would move it. Close that one and move the pin by
# hand, or not at all. Retarget any other to the release branch, or, when the advisory is about
# something a published artifact carries, ship it as a patch release from master.

version: 2

updates:
  # The SDK, the demo and the documentation samples share one build and one version catalog.
  # The IntelliJ plugin is a build of its own, with its own wrapper and its own platform.
  - package-ecosystem: gradle
    directories:
      - /
      - /editors/intellij
    target-branch: release/0.13.0
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A floor, set to what Spring Boot pins (see gradle/libs.versions.toml). Code compiled
      # against a newer release fails under Boot with NoSuchMethodError, so it moves when Boot
      # does, by hand. coroutinesNewest, which only tests run on, shares the artifact and is
      # raised by hand with it.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Held on the 0.11 line for the GraalVM 21 toolchain; see gradle/libs.versions.toml.
      - dependency-name: "org.graalvm.buildtools.native"
        update-types: ["version-update:semver-major"]
      # The Netty testOldestKtor runs Ktor 3.0 on stays on 4.1, the line Ktor 3.0 was built
      # against; see nettyOldestKtor in gradle/libs.versions.toml.
      - dependency-name: "io.netty:netty-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /editors/vscode
    target-branch: release/0.13.0
    schedule:
      interval: weekly
    groups:
      vscode:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The API types follow engines.vscode, the oldest editor the extension runs on. Newer types
      # would let the code call what that editor lacks; they move with engines.vscode, by hand.
      - dependency-name: "@types/vscode"
      # The Node types follow the floor in engines.node, 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A major TypeScript release (7 is the native compiler) is its own piece of work.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The documentation site, which is built with Bun and has bun.lock rather than a
  # package-lock.json.
  - package-ecosystem: bun
    directory: /docs
    target-branch: release/0.13.0
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # As for the extension: a major TypeScript release is its own piece of work.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The distroless base under streamlord-live. It is the only part of that image this
  # repository does not compile, and so the only part a new Debian advisory can be about.
  - package-ecosystem: docker
    directory: /demo
    target-branch: release/0.13.0
    schedule:
      interval: weekly

  # The actions the workflows run, with the secrets those workflows hold.
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.13.0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
