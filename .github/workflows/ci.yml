name: CI

on:
  push:
    branches: [master]
    tags: ["vscode-v*", "intellij-v*", "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: streamlord-vsix
          path: editors/vscode/*.vsix

  intellij:
    name: IntelliJ plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and verify
        run: ./gradlew buildPlugin test verifyPlugin --no-daemon

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: streamlord-intellij
          path: editors/intellij/build/distributions/*.zip

      - name: Upload verifier reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intellij-verifier-reports
          path: editors/intellij/build/reports/pluginVerifier/**

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The site reads the TextMate grammars and the token colours out of
      # editors/vscode, so a change there can break this build. That is the
      # coupling working, not a mistake.
      - name: Build
        run: bun run build

      - name: Check internal links
        run: bun run check:links

      - run: bun run lint
      - run: bun run typecheck

  demo-image:
    name: streamlord-live image
    runs-on: ubuntu-latest
    # Only from master. A pull request has already had the service compiled and its
    # examples checked by the sdk job; pushing an image nobody deploys is noise.
    if: github.ref == 'refs/heads/master'
    needs: [sdk]
    permissions:
      contents: read
      packages: write
    # On the job, not the step: the secrets context is not available in a step's `if`, and
    # a step's own env is not reliably visible to its own condition.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Built here rather than inside the image: the Gradle cache lives in this runner,
      # and a build failure belongs in a log somebody reads.
      - name: Build the distribution
        run: ./gradlew :demo:installDist --no-daemon

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR takes only lowercase, and the account is MarkusAugust. Computed rather than
      # written out, so a renamed account or a fork still pushes to the right place.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # No build cache. The image is a JRE base layer and one COPY of the distribution,
      # and that layer changes on every build by definition — a cache would buy nothing
      # and cost a buildx driver step, which is what the first attempt failed on.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/streamlord-live:latest
            ghcr.io/${{ steps.owner.outputs.name }}/streamlord-live:${{ github.sha }}

      # Railway pins the digest it deployed with, so a new :latest in the registry is a
      # tag nothing is watching: the service kept answering from an image two commits
      # old, and nothing said so. --from-source is the flag that pulls the tag again
      # rather than re-running the same digest.
      #
      # Skipped, not failed, when the secret is absent, so a fork still builds an image.
      - name: Redeploy streamlord-live
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway redeploy --service streamlord-live --from-source --yes

      # redeploy returns as soon as Railway accepts the request, so a green job so far
      # means the image was handed over, not that anything answers. Every failure in this
      # phase has been of that shape: right in one place, invisible in another, silent in
      # between. This is where the job stops being able to lie about it.
      - name: Check that it answers
        if: env.RAILWAY_TOKEN != ''
        env:
          SERVICE: https://streamlord-live-production.up.railway.app
          ORIGIN: https://streamlord-docs.netlify.app
        run: |
          set -euo pipefail

          echo "Waiting for the new deployment to serve /health"
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SERVICE/health")" = "200" ]; then
              echo "  healthy after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::$SERVICE/health never returned 200"
              exit 1
            fi
            sleep 5
          done

          # The documentation's origin specifically: a service that answers curl and refuses
          # the site is exactly the state this phase shipped twice.
          preflight=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: datastar-request' \
            "$SERVICE/search")
          if [ "$preflight" != "200" ]; then
            echo "::error::CORS preflight from $ORIGIN returned $preflight, not 200"
            exit 1
          fi
          echo "  preflight from the documentation: 200"

          # A real search, not a ping. The index is built into the image, so an empty result
          # here means the image shipped without one.
          body=$(curl -s --max-time 15 \
            -H "Origin: $ORIGIN" \
            -H 'Accept: text/event-stream' \
            "$SERVICE/search?datastar=%7B%22query%22%3A%22readSignals%22%7D")

          echo "$body" | grep -q '^event: datastar-patch-elements' \
            || { echo "::error::no patch-elements frame in the response"; echo "$body" | head -5; exit 1; }
          echo "$body" | grep -q 'fs-link' \
            || { echo "::error::the search returned no hits — is the index in the image?"; exit 1; }
          echo "  a search for readSignals came back with hits"

  publish-vscode:
    name: Publish VS Code extension
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [vscode]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#vscode-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "tag $tag != package.json $version"; exit 1; fi

      - run: npm run build

      - name: Publish to the Marketplace
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-intellij:
    name: Publish IntelliJ plugin
    if: startsWith(github.ref, 'refs/tags/intellij-v')
    needs: [intellij]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#intellij-v}"
          version="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$version" ]; then echo "tag $tag != pluginVersion $version"; exit 1; fi

      - name: Publish to the JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}

  publish-maven-central:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$version" ]; then echo "tag $tag != gradle.properties $version"; exit 1; fi

      - name: Publish all modules, signed, with automatic release
        run: ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  verify-signing:
    name: Verify signing secrets (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Sign every module with the CI key, publish nothing
        run: ./gradlew signMavenPublication --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
