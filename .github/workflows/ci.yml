name: CI

on:
  push:
    branches: [main]
    tags: ["vscode-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: streamlord-vsix
          path: editors/vscode/*.vsix

  publish-vscode:
    name: Publish VS Code extension
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [vscode]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#vscode-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "tag $tag != package.json $version"; exit 1; fi

      - run: npm run build

      - name: Publish to the Marketplace
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
