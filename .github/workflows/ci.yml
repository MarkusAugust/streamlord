name: CI

on:
  push:
    # A release branch collects the next version's pull requests before any of it is released,
    # so its tip is tested on every push the way master's is.
    branches: [master, "release/**"]
    tags: ["vscode-v*", "intellij-v*", "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # Every job below asks this one whether it has anything to do.
    #
    # Before it existed, a commit touching one markdown file compiled a GraalVM native
    # image, pushed it to a registry and redeployed Railway, eight minutes and a
    # deployment to ship prose that no binary contains. The work is real when the
    # sources are, and this is where that is decided once.
    outputs:
      kotlin: ${{ steps.paths.outputs.kotlin }}
      vscode: ${{ steps.paths.outputs.vscode }}
      intellij: ${{ steps.paths.outputs.intellij }}
      docs: ${{ steps.paths.outputs.docs }}
      image: ${{ steps.paths.outputs.image }}
      ktlint: ${{ steps.paths.outputs.ktlint }}
    steps:
      # The whole history, because this job's only question is what a commit changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out which parts the change touches
        id: paths
        run: |
          set -euo pipefail

          everything() {
            for part in kotlin vscode intellij docs image ktlint; do
              echo "$part=true" >> "$GITHUB_OUTPUT"
            done
            echo "$1"
          }

          # A tag publishes and a manual run was asked for on purpose. Neither is a
          # place to be clever, and every wrong answer here is a release that did not
          # happen.
          case "$GITHUB_REF" in
            refs/tags/*) everything "A tag: building everything."; exit 0 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            everything "Started by hand: building everything."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            everything "Nothing to compare against: building everything."
            exit 0
          fi

          files=$(git diff --name-only "$base" "$GITHUB_SHA")
          echo "Changed:"
          echo "$files" | sed 's/^/  /'

          kotlin=false; vscode=false; intellij=false; docs=false; image=false; ktlint=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Any Kotlin file, wherever it lives, and the rules it is held to, at the root or
            # in an .editorconfig nearer the sources.
            case "$file" in
              *.kt|.editorconfig|*/.editorconfig) ktlint=true ;;
            esac
            case "$file" in
              # This file decides what runs, so a change to it runs everything.
              .github/workflows/*)
                kotlin=true; vscode=true; intellij=true; docs=true; image=true; ktlint=true ;;
              # The corpus both editors' checks are held to: CorpusTest in the SDK reads it too,
              # and the front page counts it, so it is site content as well.
              editors/vscode/test/fixtures/corpus/*) vscode=true; kotlin=true; intellij=true; docs=true ;;
              # The other shared fixtures: the cases both analyses hold under twins/, which core
              # reads some of too, the SSE corpus, and the templates IntelliJ reads.
              editors/vscode/test/fixtures/*) vscode=true; kotlin=true; intellij=true ;;
              # The site highlights its code with the extension's grammars and palette, and shows its icon.
              editors/vscode/syntaxes/*|editors/vscode/media/*|editors/vscode/src/palette.ts) vscode=true; docs=true ;;
              editors/vscode/*)   vscode=true ;;
              editors/intellij/*) intellij=true ;;
              # The catalog feeds the analysis, which the image bundles for /judge, VS Code's generated
              # custom data, and the counts on the front page.
              catalog/*)          kotlin=true; vscode=true; intellij=true; docs=true; image=true ;;
              # The pages are compiled by docs-samples and indexed into the image, so
              # they are Kotlin sources and image content as much as they are prose.
              docs/src/content/docs/*) docs=true; kotlin=true; image=true ;;
              # The front page's samples are compiled by docs-samples too.
              docs/src/samples/*) docs=true; kotlin=true ;;
              # The transcripts the pages import are goldens the Kotlin build checks.
              docs/src/generated/*) docs=true; kotlin=true ;;
              docs/*)             docs=true ;;
              # Netlify's build of the site, which deploys from master with no other check.
              netlify.toml)       docs=true ;;
              demo/*)             kotlin=true; image=true ;;
              # The fixtures are read by the Kotlin tests, the VS Code tests and the front page; the
              # image and the IntelliJ plugin read none of them.
              conformance/*)      kotlin=true; vscode=true; docs=true ;;
              # The IntelliJ plugin builds streamlord-analysis, and core beneath it, from source.
              streamlord-core/*)  kotlin=true; image=true; intellij=true ;;
              # The image runs the analysis in /judge and streamlord-test in /assert.
              streamlord-analysis/*) kotlin=true; image=true; intellij=true ;;
              streamlord-test/*)  kotlin=true; image=true ;;
              streamlord-html/*|streamlord-ktor/*|streamlord-json-kotlinx/*)
                kotlin=true; image=true ;;
              streamlord-*/*|docs-samples/*)
                kotlin=true ;;
              # The README carries coordinates checkDocSamples verifies, and LICENSE goes into every jar.
              README.md|LICENSE)  kotlin=true ;;
              # The version catalog and the settings scripts are the plugin's build too.
              # The site reads the catalog for the versions on the front page.
              gradle/libs.versions.toml) kotlin=true; image=true; intellij=true; docs=true ;;
              # The site reads the version out of gradle.properties.
              gradle.properties)  kotlin=true; image=true; intellij=true; docs=true ;;
              gradle/*|gradlew*|*.gradle.kts)
                kotlin=true; image=true; intellij=true ;;
            esac
          done <<< "$files"

          {
            echo "kotlin=$kotlin"
            echo "vscode=$vscode"
            echo "intellij=$intellij"
            echo "docs=$docs"
            echo "image=$image"
            echo "ktlint=$ktlint"
          } >> "$GITHUB_OUTPUT"
          echo "Running: kotlin=$kotlin vscode=$vscode intellij=$intellij docs=$docs image=$image ktlint=$ktlint"

  sdk:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.kotlin == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  ktlint:
    name: Kotlin style
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ktlint == 'true'
    # The CLI rather than a Gradle plugin: one jar, no new dependency in the build, and it covers
    # the IntelliJ plugin's sources as well, which are a build of their own. The checksum is the
    # one GitHub lists for the release asset; a new version needs both changed together.
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch ktlint
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ktlint"

      # Relative globs: ktlint walks from here. The .kts build scripts are left out, as they
      # are everywhere ktlint is run in this repository.
      - name: Check the Kotlin sources
        run: |
          "$RUNNER_TEMP/ktlint" --relative "**/*.kt" "!**/build/**" "!**/node_modules/**" "!editors/vscode/test/fixtures/**"

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.vscode == 'true'
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies

      - name: Upload vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamlord-vsix
          path: editors/vscode/*.vsix

  intellij:
    name: IntelliJ plugin
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.intellij == 'true'
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build, test and verify
        run: ./gradlew buildPlugin test verifyPlugin --no-daemon

      - name: Upload plugin archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamlord-intellij
          path: editors/intellij/build/distributions/*.zip

      - name: Upload verifier reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intellij-verifier-reports
          path: editors/intellij/build/reports/pluginVerifier/**

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Bun that wrote docs/bun.lock (lockfile version 2); a floating tag is a build nobody has run.
          # BUN_VERSION in netlify.toml is the same pin for the build that deploys.
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      # The site reads the TextMate grammars and the token colours out of
      # editors/vscode, so a change there can break this build. That is the
      # coupling working, not a mistake.
      - name: Build
        run: bun run build

      - name: Check internal links
        run: bun run check:links

      - run: bun run lint
      - run: bun run typecheck

  demo-image:
    name: streamlord-live image
    runs-on: ubuntu-latest
    # Built and run on master, on a release branch and on a release tag; pushed and deployed
    # from master alone, by demo-deploy. A release branch is where a native-image failure
    # should surface, before anything is tagged, and the tag run is what publish-maven-central
    # waits for. A pull request has already had the service compiled and its examples checked
    # by the sdk job. vscode-v tags start with refs/tags/v too, hence the exception.
    if: >-
      (github.ref == 'refs/heads/master'
        || startsWith(github.ref, 'refs/heads/release/')
        || (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vscode-v')))
      && needs.changes.outputs.image == 'true'
    needs: [changes, sdk]
    # Read-only, on every ref: the push is a job of its own so that packages: write exists
    # only in a run that pushes. A permission cannot be given by condition.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GraalVM rather than Temurin: this job compiles the service to a native image.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Compiled here rather than inside the image: it wants 6-8 GB and several minutes,
      # the Gradle cache lives in this runner, and a failure belongs in a log somebody
      # reads rather than in a docker build nobody can cache.
      - name: Compile the native image
        run: ./gradlew :demo:nativeCompile --no-daemon

      # GHCR takes only lowercase, and the account is MarkusAugust. Computed rather than
      # written out, so a renamed account or a fork still pushes to the right place.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # What the binary still expects from the world outside it.
      #
      # --static-nolibc promises that the answer is glibc and nothing else, and the
      # distroless base carries glibc and nothing else. When those two disagree the image
      # builds, pushes and deploys green, and the container exits on its first instruction
      # with a missing libz.so.1, a failure that is invisible to every step before it.
      # Twenty lines here turn that into a build error naming the library.
      - name: Check what the binary links against
        run: |
          set -euo pipefail
          binary=demo/build/native/nativeCompile/streamlord-live

          file "$binary"
          needed=$(objdump -p "$binary" | awk '/NEEDED/ { print $2 }' | sort)
          echo "Dynamically linked against:"
          echo "$needed" | sed 's/^/  /'

          # glibc, in the forms it is packaged in. Anything else (libz, libstdc++,
          # libgcc_s) is a library the base image does not have.
          allowed="libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0 librt.so.1"
          missing=""
          for lib in $needed; do
            case " $allowed " in
              *" $lib "*) ;;
              *) missing="$missing $lib" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::the binary needs$missing, which gcr.io/distroless/base-debian13 does not carry"
            exit 1
          fi
          echo "  glibc only, as --static-nolibc promises"

      # The image, built here and not pushed yet.
      #
      # docker build rather than build-push-action, because the next step has to run this
      # exact image before anyone else sees it, and that is worth more than the action's
      # conveniences. There is no layer cache to lose: the image is a base layer and one
      # COPY of a binary that changes on every build by definition.
      - name: Build the image
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/streamlord-live
        run: |
          docker build \
            --build-arg "BUILD_SHA=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            -f demo/Dockerfile .

      # Run it here, before pushing. This is the step the libz failure was missing: the
      # container starts or it does not, in a runner, on the same image that would have
      # gone to Railway, and a binary that cannot start fails the job with its own log
      # instead of becoming a 502 on the documentation site.
      #
      # It also asks the questions that only the running service can answer: whether the
      # search index made it into the image, and whether the documentation's origin gets
      # through CORS. Both have shipped broken before, and both are free to check here.
      - name: Start the image and call it
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/streamlord-live
          # The address readers use. Netlify's own name serves the same site, so the
          # preflight below is asked from both.
          ORIGIN: https://streamlord.sobernetics.no
          NETLIFY_ORIGIN: https://streamlord-docs.netlify.app
        run: |
          set -euo pipefail
          trap 'docker logs streamlord-live 2>&1 | tail -40; docker rm -f streamlord-live >/dev/null 2>&1 || true' EXIT

          docker run -d --name streamlord-live -p 8080:8080 "$IMAGE:$GITHUB_SHA"

          echo "Waiting for the container to answer /health"
          health=""
          for attempt in $(seq 1 30); do
            health=$(curl -s --max-time 2 http://localhost:8080/health || true)
            [ -n "$health" ] && break
            sleep 1
          done

          # /health returns the commit it was built from, so this also proves the image
          # carries the build it says it does.
          if [ "$health" != "$GITHUB_SHA" ]; then
            echo "::error::/health returned '${health:-nothing}', expected $GITHUB_SHA"
            exit 1
          fi
          echo "  up, and reporting $GITHUB_SHA"

          for from in "$ORIGIN" "$NETLIFY_ORIGIN"; do
            preflight=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -X OPTIONS \
              -H "Origin: $from" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: datastar-request' \
              http://localhost:8080/search)
            if [ "$preflight" != "200" ]; then
              echo "::error::CORS preflight from $from returned $preflight, not 200"
              exit 1
            fi
            echo "  preflight from $from: 200"
          done

          body=$(curl -s --max-time 10 \
            -H "Origin: $ORIGIN" \
            -H 'Accept: text/event-stream' \
            'http://localhost:8080/search?datastar=%7B%22query%22%3A%22readSignals%22%7D')

          echo "$body" | grep -q '^event: datastar-patch-elements' \
            || { echo "::error::no patch-elements frame in the response"; echo "$body" | head -5; exit 1; }
          echo "$body" | grep -q 'lt-link' \
            || { echo "::error::the search returned no hits. Is the index in the image?"; exit 1; }
          echo "  a search for readSignals came back with hits"

          # A stream, which is a different thing from a response: the counter holds one
          # connection open and writes to it over time. Four seconds is about nine numbers,
          # so two of them arriving apart in time is the whole assertion. A native image
          # that answers a request but cannot hold a stream would pass every check above.
          counter=$(curl -s --max-time 4 \
            -H 'Accept: text/event-stream' \
            'http://localhost:8080/counter?datastar=%7B%22running%22%3Afalse%7D' || true)

          for n in 1 5; do
            echo "$counter" | grep -q "\"count\": $n" \
              || { echo "::error::the counter never reached $n"; echo "$counter" | head -8; exit 1; }
          done
          echo "  the counter streamed over time"

          # A page declared from a class through the codec: toJsonValue encodes with the same
          # named serializer readSignals decodes with, so an image that cannot find it fails here.
          csp=$(curl -s --max-time 5 http://localhost:8080/csp)
          echo "$csp" | grep -q 'data-signals="{&quot;running&quot;:false,&quot;count&quot;:0' \
            || { echo "::error::the CSP page did not declare CounterSignals"; echo "$csp" | head -5; exit 1; }
          echo "  a page declared its signals from a class"

          # A POST, which reads the signals from the body rather than the query, and a form
          # that fails on purpose. The reply is two events: the faults as signals, and the
          # summary as markup in a design system's classes the service cannot see.
          muster=$(curl -s --max-time 5 -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            -d '{"banner":"Ox","swords":"x"}' \
            http://localhost:8080/muster)

          echo "$muster" | grep -q 'lt-error-summary' \
            || { echo "::error::no error summary came back from /muster"; echo "$muster" | head -8; exit 1; }
          echo "$muster" | grep -q '"bannerFault"' \
            || { echo "::error::/muster sent no field faults"; exit 1; }
          echo "  the form was checked and the faults came back"

          # A remove, which is the one event that carries no elements at all. If the encoder
          # ever starts writing an empty elements line, the protocol is wrong in a way the
          # golden files would catch but a running service would not.
          removed=$(curl -s --max-time 5 \
            'http://localhost:8080/modes?datastar=%7B%22mode%22%3A%22remove%22%7D')

          echo "$removed" | grep -q '^data: mode remove' \
            || { echo "::error::/modes did not send a remove"; echo "$removed" | head -8; exit 1; }
          echo "$removed" | head -4 | grep -q '^data: elements' \
            && { echo "::error::the remove carried elements, which it must not"; exit 1; }
          echo "  a remove went out as a selector and a mode"

          # The front page's example: the count comes out of the signals and goes back one higher.
          feed=$(curl -s --max-time 5 \
            -H 'Accept: text/event-stream' \
            'http://localhost:8080/feed?datastar=%7B%22heads%22%3A13%7D')

          echo "$feed" | grep -q '<li>A new head hangs on the wall</li>' \
            || { echo "::error::/feed hung no head"; echo "$feed" | head -8; exit 1; }
          echo "$feed" | grep -q '"heads": 14' \
            || { echo "::error::/feed did not count 13 to 14"; echo "$feed" | head -8; exit 1; }
          echo "  the feed counted a head"

          # The test panel: a fresh feed from 13 read back by streamlord-test's reader and held
          # to two assertions. The test as written proves the reader is in the image; the broken
          # one proves the failure comes back as the reader's own message, with the stream in it.
          passed=$(curl -s --max-time 5 -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            -d '{"broken":false}' \
            http://localhost:8080/assert)

          echo "$passed" | grep -q 'Both assertions passed' \
            || { echo "::error::/assert did not pass. Is streamlord-test in the image?"; echo "$passed" | head -8; exit 1; }

          failed=$(curl -s --max-time 5 -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            -d '{"broken":true}' \
            http://localhost:8080/assert)

          echo "$failed" | grep -q 'is 14, expected 99' \
            || { echo "::error::/assert did not fail on broken with the reader's message"; echo "$failed" | head -8; exit 1; }
          echo "$failed" | grep -q 'The stream carried 2 events' \
            || { echo "::error::/assert failed without printing the stream"; exit 1; }
          echo "  the assertions passed as written and failed when broken, stream and all"

          # The judge reads the analysis's catalog as a resource by name, which is exactly the
          # kind of file a native image leaves out. A verdict with the editors' own message in
          # it proves the catalog is in the image; a 500 here is what a missing one looks like.
          judge=$(curl -s --max-time 10 -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            -d '{"source":"dataOnClick(\"$count++\")"}' \
            http://localhost:8080/judge)

          echo "$judge" | grep -q 'Kotlin interpolates $count here' \
            || { echo "::error::/judge gave no verdict. Is the catalog in the image?"; echo "$judge" | head -8; exit 1; }
          echo "$judge" | grep -q 'judge__fix' \
            || { echo "::error::/judge offered no fix"; exit 1; }
          echo "  the judge read a paste and offered a fix"

      # Known vulnerabilities in the image. On master this is the last point at which one can
      # still be kept out of production; on a release branch it is the warning before
      # anything is tagged. The binary is scanned in its sources by security.yml, so what
      # this mostly sees is the Debian under distroless.
      #
      # Only HIGH and CRITICAL, and only those with a fixed version: an advisory with no fix
      # is one this build cannot act on, and failing over it would hold every deployment
      # hostage to Debian's schedule. security.yml lists the rest in the Security tab.
      #
      # On a tag it reports and does not fail. The image is not what a tag publishes, and a
      # base-image advisory, or a scanner that cannot fetch its database, should not hold a
      # Maven Central release back; the release branch has already shown the finding.
      # continue-on-error rather than exit-code, because exit-code governs findings only.
      #
      # Pinned to a commit; security.yml says why.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/streamlord-live:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The image that was run and scanned above, handed to demo-deploy as it is.
      - name: Save the image
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/streamlord-live
        run: docker save "$IMAGE:$GITHUB_SHA" "$IMAGE:latest" -o streamlord-live.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/master'
        with:
          name: streamlord-live-image
          path: streamlord-live.tar
          retention-days: 1

  demo-deploy:
    name: streamlord-live deploy
    runs-on: ubuntu-latest
    # Everything in this job reaches the outside world, and only master does that.
    if: github.ref == 'refs/heads/master'
    needs: [demo-image]
    # Two pushes to master close together deploy one after the other, never side by side, and
    # the second waits for the first rather than cancelling it halfway through a deploy.
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    # Whether to deploy, on the job: the secrets context is not available in a step's `if`,
    # and a step's own env is not reliably visible to its own condition. The token itself
    # goes to the two Railway steps alone, below; nothing else in the job holds it.
    env:
      HAS_RAILWAY: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: streamlord-live-image

      - name: Load the image
        run: docker load -i streamlord-live.tar

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The group above deploys one run at a time, but not in push order: an older run whose
      # image took longer reaches this job after a newer one has deployed, and GitHub keeps
      # one waiting job per group, cancelling the one already waiting. A commit master has
      # moved past is not pushed or deployed, and the job stays green, since nothing failed.
      - name: Check that this commit is still master's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master is at $tip now, not $GITHUB_SHA; leaving the deployment to the newer run"
          fi

      - name: Push the image
        if: steps.tip.outputs.latest == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/streamlord-live"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      # Railway pins the digest it deployed with, so a new :latest in the registry is a
      # tag nothing is watching: the service kept answering from an image two commits
      # old, and nothing said so. --from-source is the flag that pulls the tag again
      # rather than re-running the same digest.
      #
      # Skipped, not failed, when the secret is absent, so a fork still builds an image.
      - name: Redeploy streamlord-live
        if: steps.tip.outputs.latest == 'true' && env.HAS_RAILWAY == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli@5.70.0
          railway redeploy --service streamlord-live --from-source --yes

      # redeploy returns as soon as Railway accepts the request, and the container it
      # replaces keeps serving while the new one starts. A check that asks for 200 gets it
      # from the old deployment and says the new one is fine, which is how a container
      # that never started once passed this step. So it waits for /health to name the
      # commit being deployed, and nothing else counts as arrived.
      - name: Check that the deployment answers
        if: steps.tip.outputs.latest == 'true' && env.HAS_RAILWAY == 'true'
        env:
          SERVICE: https://streamlord-live-production.up.railway.app
        run: |
          set -euo pipefail

          echo "Waiting for $GITHUB_SHA to be the build answering /health"
          for attempt in $(seq 1 60); do
            health=$(curl -s --max-time 10 "$SERVICE/health" || true)
            if [ "$health" = "$GITHUB_SHA" ]; then
              echo "  serving $GITHUB_SHA after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::after five minutes /health still returns '${health:-nothing}', not $GITHUB_SHA"
              exit 1
            fi
            sleep 5
          done

          # The image was exercised in full before it was pushed, so what is left to check
          # here is what a deployment can break and a container cannot: the proxy in front
          # of it. Each of these failed differently in production and nowhere else.
          origin='https://streamlord.sobernetics.no'

          # A search: reachable from outside Railway at all.
          body=$(curl -s --max-time 15 \
            -H "Origin: $origin" \
            -H 'Accept: text/event-stream' \
            "$SERVICE/search?datastar=%7B%22query%22%3A%22readSignals%22%7D")

          echo "$body" | grep -q 'lt-link' \
            || { echo "::error::the deployed search returned no hits"; echo "$body" | head -5; exit 1; }
          echo "  a search came back with hits"

          # A stream, cut off deliberately. The counter runs for twelve seconds and this
          # waits six, so a proxy that buffers the response instead of flushing it would
          # hand back nothing at all. Two numbers arriving inside the window is the proof
          # that Railway passes Server-Sent Events through as they are written.
          counter=$(curl -s --max-time 6 \
            -H 'Accept: text/event-stream' \
            "$SERVICE/counter?datastar=%7B%22running%22%3Afalse%7D" || true)

          for n in 1 5; do
            echo "$counter" | grep -q "\"count\": $n" \
              || { echo "::error::the deployed counter never reached $n. Is the stream buffered?";
                   echo "$counter" | head -6; exit 1; }
          done
          echo "  the counter streamed through the proxy"

          # A POST with a body, which is the only request here that carries its signals
          # rather than asking for something, and the only one whose content type a proxy
          # has any opinion about.
          muster=$(curl -s --max-time 15 -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $origin" \
            -d '{"banner":"Ox","swords":"x"}' \
            "$SERVICE/muster")

          echo "$muster" | grep -q 'lt-error-summary' \
            || { echo "::error::the deployed form sent no error summary"; echo "$muster" | head -6; exit 1; }
          echo "  the form answered a POST"

          # And the one event that carries no elements, which is the shape a proxy or a
          # rewrite would be most likely to quietly fill in.
          removed=$(curl -s --max-time 15 \
            "$SERVICE/modes?datastar=%7B%22mode%22%3A%22remove%22%7D")

          echo "$removed" | grep -q '^data: mode remove' \
            || { echo "::error::the deployed gallery did not send a remove"; echo "$removed" | head -6; exit 1; }
          echo "  a remove arrived as a selector and a mode"

  publish-vscode:
    name: Publish VS Code extension
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [vscode]
    runs-on: ubuntu-latest
    # The release environment holds the publishing secrets and takes the release tags, and master and
    # the release branches for verify-signing, which is run by hand.
    environment: release
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#vscode-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "tag $tag != package.json $version"; exit 1; fi

      - run: npm run build

      - name: Publish to the Marketplace
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-intellij:
    name: Publish IntelliJ plugin
    if: startsWith(github.ref, 'refs/tags/intellij-v')
    needs: [intellij]
    runs-on: ubuntu-latest
    # The release environment holds the publishing secrets and takes the release tags, and master and
    # the release branches for verify-signing, which is run by hand.
    environment: release
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Check that the tag matches gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#intellij-v}"
          version="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$version" ]; then echo "tag $tag != pluginVersion $version"; exit 1; fi

      # The plugin is signed when the three certificate secrets are set, and the signing task is
      # silently skipped when they are not. An unsigned release is not what the workflow says it
      # does, so it stops here instead.
      - name: Check that the signing certificate is there
        env:
          HAS_CERTIFICATE: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN != '' && secrets.JETBRAINS_PRIVATE_KEY != '' && secrets.JETBRAINS_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_CERTIFICATE" != "true" ]; then
            echo "::error::JETBRAINS_CERTIFICATE_CHAIN, JETBRAINS_PRIVATE_KEY and JETBRAINS_PRIVATE_KEY_PASSWORD must all be set; without them publishPlugin uploads an unsigned plugin."
            exit 1
          fi

      - name: Publish to the JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}

  publish-maven-central:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vscode-v')
    # The image too: a release is tagged before it reaches master, so this run is the first
    # place the native image is built from the released commit, and nothing goes to Maven
    # Central until it has compiled and answered.
    needs: [sdk, demo-image]
    runs-on: ubuntu-latest
    # The release environment holds the publishing secrets and takes the release tags, and master and
    # the release branches for verify-signing, which is run by hand.
    environment: release
    # On this job alone, because it is the only one that writes anything to the repository:
    # the release it announces at the end. The others keep the read-only default, apart from
    # demo-deploy, which writes to the container registry.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Check that the tag matches gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$version" ]; then echo "tag $tag != gradle.properties $version"; exit 1; fi

      # Before publishing, because a version on Maven Central cannot be changed and a missing
      # changelog section almost always means the release was not prepared. Failing here costs
      # a tag; failing after the upload costs a version number.
      - name: Take the release notes from the changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # The section for this version, from its heading to the next one, with the blank
          # lines at either end trimmed off.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md \
            | awk 'NF { seen = 1 } seen { print }' \
            | awk '{ lines[NR] = $0 }
                   END { last = NR
                         while (last > 0 && lines[last] == "") last--
                         for (i = 1; i <= last; i++) print lines[i] }' \
            > "$RUNNER_TEMP/notes.md"

          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version. Write it before tagging: the"
            echo "::error::release notes are that text, and nothing is published without them."
            exit 1
          fi

          echo "Release notes for $version, $(wc -l < "$RUNNER_TEMP/notes.md" | tr -d ' ') lines:"
          sed 's/^/  /' "$RUNNER_TEMP/notes.md"

      - name: Publish all modules, signed, with automatic release
        run: ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # Last, and only if the upload was accepted: a release page that points at something
      # nobody can download is worse than no release page.
      #
      # No jars attached. Maven Central is where this is distributed from, and a second copy
      # on GitHub is a second thing to keep in step. A version with a hyphen in it, 0.4.0-rc1
      # for example, is marked a pre-release so a candidate never takes the "latest" label.
      #
      # This is the step that was missing: 0.1.1, 0.2.0 and 0.3.0 were tagged, published, and
      # never announced, and the repository showed 0.1.0 as the latest release for four days.
      - name: Announce the release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          case "$version" in
            *-*) kind="--prerelease" ;;
            *)   kind="--latest" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "Streamlord $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            $kind

  verify-signing:
    name: Verify signing secrets (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The signing key lives in the release environment, so a run from a branch the environment
    # does not take stops here, before the key is read.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Sign every module with the CI key, publish nothing
        run: ./gradlew signMavenPublication --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
