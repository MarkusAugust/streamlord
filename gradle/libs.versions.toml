[versions]
kotlin = "2.4.21"
# The oldest Kotlin a consumer may compile with: what Spring Boot 4.0 manages. The published
# modules are built to its language and API level, and docs-samples compiles with it.
kotlinFloor = "2.2.21"
# A floor, not a preference. Spring Boot pins coroutines in its BOM (4.0 and 4.1 pin 1.10.2) and
# downgrades anything newer, so code compiled against a later release fails there with
# NoSuchMethodError: 1.11 compiles runBlocking to a symbol 1.10 does not have. Raise it only when
# the oldest supported Boot does.
coroutines = "1.10.2"
coroutinesNewest = "1.11.0"
serialization = "1.11.0"
kotlinxHtml = "0.12.0"
ktor = "3.6.0"
# The oldest Ktor the adapter promises to run on; testOldestKtor runs its tests against it.
ktorOldest = "3.0.0"
# The Netty testOldestKtor runs Ktor 3.0's Netty engine on. Ktor 3.0.0 brings 4.1.114.Final, which
# has known vulnerabilities; this is the 4.1 release install.md tells a user on Ktor 3.0 to raise
# it to, so the promise is tested on what users are told to run. It stays on 4.1, the line
# Ktor 3.0 was built against.
nettyOldestKtor = "4.1.139.Final"
# The same for Ktor 3.0's Tomcat and Jetty engines, which bring Tomcat 10.1.30 and Jetty 11.0.24.
# 11.0.26 is the last Jetty 11 on Maven Central, and it still has advisories install.md names.
tomcatOldestKtor = "10.1.61"
jettyOldestKtor = "12.1.14"
spring = "7.0.9"
servlet = "6.1.0"
# Spring Boot 4.0.8 pins 11.0.24, which has three advisories fixed in 11.0.25; the tests run the current 11.0 line.
tomcat = "11.0.27"
reactor = "3.8.7"
jackson = "3.2.4"
jackson2 = "2.22.4"
# Floors for libraries the build's own tools carry (Dokka, the IntelliJ Platform plugin), raised
# past the advisories those tools' pins have; gradle/build-tool-floors.settings.gradle.kts
# applies them. Nothing published depends on them.
buildToolsJackson = "2.22.4"
buildToolsJsoup = "1.23.2"
buildToolsFreemarker = "2.3.35"

[libraries]
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Test-only, for :streamlord-spring: Spring MVC needs it to run a suspend controller.
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinxHtml" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
# Used only by :docs-samples, so that the error-handling example on the security page is compiled
# rather than asserted.
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
# Used only by :demo, the service behind the documentation site.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
# Test-only, for :streamlord-ktor: Netty sends no headers before the first byte of the body.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Test-only, for :streamlord-ktor: Tomcat and Jetty end a failed body as if it had finished.
ktor-server-tomcat-jakarta = { module = "io.ktor:ktor-server-tomcat-jakarta", version.ref = "ktor" }
# Test-only, for :streamlord-ktor: Ktor's javax servlet engine, on the Tomcat 9 it brings.
ktor-server-tomcat = { module = "io.ktor:ktor-server-tomcat", version.ref = "ktor" }
ktor-server-jetty-jakarta = { module = "io.ktor:ktor-server-jetty-jakarta", version.ref = "ktor" }
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# Test-only, for :streamlord-ktor's testOldestKtor; see nettyOldestKtor.
netty-bom-oldestKtor = { module = "io.netty:netty-bom", version.ref = "nettyOldestKtor" }
jetty-bom-oldestKtor = { module = "org.eclipse.jetty:jetty-bom", version.ref = "jettyOldestKtor" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }
# Test-only, for :streamlord-spring and :docs-samples: MockMvcTester asserts with AssertJ, and the
# testing page shows it. Spring Boot 4.0 manages the 3.27 line.
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.7" }
# Test-only, for :streamlord-spring: WebTestClient bound to a controller, for the WebFlux side.
# :docs-samples compiles the testing page's WebTestClient example against it.
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring" }
jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "servlet" }
# Test-only, for :streamlord-spring. The WebFlux mocks in spring-test touch Publisher, so a
# test of the nonce helper needs Reactor on the runtime classpath. The main source does not:
# the helper takes a ServerWebExchange and returns a String, which is why no WebFilter ships.
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
# Test-only, for :streamlord-spring: a real container, for the timeouts and threads that
# MockMvc never runs.
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson2-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson2" }
# Never declared as dependencies: listed so Dependabot keeps the floors above current.
buildTools-jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "buildToolsJackson" }
buildTools-jsoup = { module = "org.jsoup:jsoup", version.ref = "buildToolsJsoup" }
buildTools-freemarker = { module = "org.freemarker:freemarker", version.ref = "buildToolsFreemarker" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
# Used only by :demo, to build streamlord-live as a native image. Held on the 0.11 line:
# 1.1.x requires a GraalVM whose reachability-metadata schema only exists from 25, and this
# build's toolchain is 21 with artifacts targeting 17. Following the plugin would mean
# dragging the whole build forward for one module.
graalvm-native = { id = "org.graalvm.buildtools.native", version = "0.11.5" }
# The API reference, generated from the KDoc that is already in the source. Used for the
# javadoc jar every published module carries, which was empty until now.
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
