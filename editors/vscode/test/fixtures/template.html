<!-- Hver attributt med kommentar skal gi markeringen kommentaren beskriver. -->
<form data-on:submit__prevent="@post('/save')">                 <!-- ingen markering -->
  <input data-bind:search data-indicator="busy">                <!-- ingen markering -->
  <div data-on:click__debunce.500ms="x()"></div>                <!-- RØD: ukjent modifier -->
  <div data-on-intersect__threshold.150="x()"></div>            <!-- RØD: threshold 0-100 -->
  <div data-on="x()"></div>                                     <!-- RØD: data-on trenger nøkkel -->
  <div data-signal:foo="1"></div>                               <!-- GUL: did you mean data-signals -->
  <div data-text="$count +"></div>                              <!-- RØD: syntaksfeil -->
  <div data-text="{{ name }}"></div>                            <!-- ingen markering (Pebble tolereres) -->
  <div data-persist data-scroll-into-view__smooth></div>        <!-- HINT: Pro -->
  <div data-star-on:click="x()"></div>                          <!-- GUL: aliasert prefix, men innstilling er data- -->
</form>
